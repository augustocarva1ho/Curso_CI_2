name: Docker

on:
  workflow_call: 

jobs:

  docker:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Docker Build
      uses: docker/setup-buildx-action@v4.4.1
        
    - name: Docker Login
      # You may pin to the exact commit or the version.
      # uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550
      uses: docker/login-action@v4.8.0
      with:
        # Username used to log against the Docker registry
        username: augustocarvalho22
        # Password or personal access token used to log against the Docker registry
        password: ${{ secrets.PASSWORD_DOCKER_HUB }}

    - name: Build and push Docker images
      # You may pin to the exact commit or the version.
      # uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
      uses: docker/build-push-action@v7.4.0
      with:
        context: .
        # Path to the Dockerfile
        file: ./Dockerfile
        # Push is a shorthand for --output=type=registry
        push: true
        # List of tags
        tags: augustocarvalho22/go_ci:${{ github.ref_name }}
